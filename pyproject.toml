[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recharness"
version = "1.4.3"
description = "A bandit-routed agentic harness for self-evolving recommender systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Anonymous Authors"}]
keywords = ["llm", "agent", "code-evolution", "recommendation-system", "bandit-routing", "thompson-sampling", "automl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "deepagents>=0.1",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.optional-dependencies]
dev      = ["pytest>=8", "pytest-asyncio>=0.23"]
# Required to actually run the cold-start templates on GPU
templates = ["torch>=2.2", "numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.3", "tqdm>=4.66"]
# Only needed to download raw competition data for MLE-Bench Lite benchmarks
mlebench = ["kaggle>=1.6,<1.7"]
# Only needed for the diversity_v3 benchmark (reads ORC/Parquet request logs)
diversity = ["pyarrow>=14.0", "pyyaml>=6.0", "numpy>=1.26", "pandas>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# BLE001 (blind except) / S110 (try-except-pass): the trial-execution harness
# and its best-effort state/logging paths intentionally catch broad Exception
# so a single failing trial or a failed log write never crashes the search
# loop or an arbitrary LLM-mutated training script. Narrowing these on a
# case-by-case basis would add risk without a clear correctness benefit.
ignore = ["BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
# Vendored verbatim from the diversity_v3 source task package (frozen evaluation
# pipeline / fixed DPP algorithm, never mutated by RecHarness) -- kept as a
# faithful copy rather than reformatted, so future re-syncs stay a clean diff.
"gagc/benchmarks/diversity_v3/vendor/*.py" = ["F541", "F841", "PLW0602", "PLW1510", "PLR1730", "I001"]
"gagc/templates/diversity_dpp/train.py" = ["F541", "F841", "PLW0602", "PLW1510", "PLR1730", "I001"]

[tool.setuptools.packages.find]
include = ["gagc*"]
exclude = ["logs*", "input*", "results*", "workspace*", "examples*", "scripts*", "tests*"]
