[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recharness"
version = "0.2.0"
description = "A bandit-routed agentic harness for self-evolving recommender systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Anonymous Authors"}]
keywords = ["llm", "agent", "code-evolution", "recommendation-system", "bandit-routing", "thompson-sampling", "automl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "deepagents>=0.1",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.optional-dependencies]
dev      = ["pytest>=8", "pytest-asyncio>=0.23"]
# Required to actually run the cold-start templates on GPU
templates = ["torch>=2.2", "numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.3", "tqdm>=4.66"]
# Only needed to download raw competition data for MLE-Bench Lite benchmarks
mlebench = ["kaggle>=1.6,<1.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["gagc*"]
exclude = ["logs*", "input*", "results*", "workspace*", "examples*", "scripts*", "tests*"]
