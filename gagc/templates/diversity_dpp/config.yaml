# ============================================================
# config.yaml — DPP 多窗口打散算法 V3 配置
# Agent 可以修改此文件中的 scatter 部分参数
# prepare.py 读取 data 和 exposure_probs 部分（不可修改）
# ============================================================

# 数据路径（不可修改，prepare.py 使用）
# 全量 ORC 数据 (60万请求, 每轮评估约30-60min)
data:
  sample_path: /cfs5/shiboying/datasets/diversity_mechanism/sample_0721_clean
  vec_path: /cfs5/shiboying/datasets/diversity_mechanism/vec_0721
  # 快速迭代 sample (500条, 每轮约30s) — 注释上面两行, 取消下面两行注释切换
  # sample_path: data/sample_500.parquet
  # vec_path: data/vec_filtered.parquet

# 坑位曝光概率（不可修改，prepare.py 使用）
exposure_probs: [1.0, 1.0, 0.418337, 0.418337, 0.167033,
                 0.167033, 0.140998, 0.140998, 0.122709, 0.122709]

# 标准2 通过率阈值（可调整，当前设定60%）
vecsim_pass_rate_threshold: 0.60

# 线上Baseline指标（参考目标，不可修改）
baseline_metrics:
  std1_top4_mean: 6.4381
  std1_top10_mean: 12.1431
  std3_top4_mean: 318.8872
  std3_top10_mean: 1421.8636
  std3_bottom6_mean: 185.4970
  std2_vecsim_max_mean: 0.622743
  std2_vecsim_mean_mean: 0.544072
  std2_vecsim_weighted_mean_mean: 0.546157
  std2_vecsim_max07_mean_mean: 0.702037
  std2_vecsim_max07_weighted_mean_mean: 0.702397

# ============================================================
# DPP 参数 (Agent 可修改, 参数详解见 background.md)
# ============================================================

scatter:
  # ── 多窗口全局配置 ──
  multiWinNum: 2                    # 多窗口DPP个数 (1-3)
  weightsFusionMethod: "sum"        # 融合方法: sum / weighted_sum / power_product
  multiWinWeights: [1.0, 1.0]       # 各窗口融合权重 (weighted_sum / power_product 时生效)
  enableMaxEi: false                # 异常数值处理: 限制打压能量不超过自身剩余能量

  # ── 各窗口 DPP 配置 ──
  dppConfigList:
    # 窗口1: 大窗口, 关注全局多样性
    - enableSlidingWindowGivensRotation: true
      slidingWindowSize: 30           # 滑动窗口大小 (超出时触发吉文斯旋转降阶)
      fstDefConfigMap:
        # PSA一阶段 (pit 0-3, 使用 fst_score)
        FIRST_POS:
          preprocessQMethod: "default"    # Q值处理: default / q_power
          expoDefaultQMethod: "default"   # 历史曝光Q值: default / topN_candi
          expoDefaultQ: 1.0               # 历史曝光商品默认Q值
          simTransformType: null          # 相似度变换: null / ONE_MINUS_EXP_NEG / SQRT_ONE_MINUS_EXP_NEG
          minSim: 0.0                     # 相似度阈值 (变换时 max(0, sim - minSim))
          expAlpha: 1.0                   # 指数变换 alpha
          expBias: 0.0                    # 指数变换偏置
          rerankMethod: "d_ratio"         # 重排方法: d_ratio / d_value
          qPower: 1.0                     # Q值幂次 (d_value + q_power 时: 越大打散越弱)
          dwPower: 1.0                    # diversity权重幂次 (d_ratio 时: 越大打散越强)
        # PSA二阶段 (pit 4-9, 使用 score)
        DEFAULT:
          preprocessQMethod: "default"
          expoDefaultQMethod: "default"
          expoDefaultQ: 1.0
          simTransformType: null
          minSim: 0.0
          expAlpha: 1.0
          expBias: 0.0
          rerankMethod: "d_ratio"
          qPower: 1.0
          dwPower: 1.0

    # 窗口2: 小窗口, 关注局部多样性
    - enableSlidingWindowGivensRotation: true
      slidingWindowSize: 10
      fstDefConfigMap:
        FIRST_POS:
          preprocessQMethod: "default"
          expoDefaultQMethod: "default"
          expoDefaultQ: 1.0
          simTransformType: null
          minSim: 0.0
          expAlpha: 1.0
          expBias: 0.0
          rerankMethod: "d_ratio"
          qPower: 1.0
          dwPower: 1.0
        DEFAULT:
          preprocessQMethod: "default"
          expoDefaultQMethod: "default"
          expoDefaultQ: 1.0
          simTransformType: null
          minSim: 0.0
          expAlpha: 1.0
          expBias: 0.0
          rerankMethod: "d_ratio"
          qPower: 1.0
          dwPower: 1.0
